services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dawiki
      POSTGRES_USER: dawiki
      POSTGRES_PASSWORD: dawiki
    ports:
      - "5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./dawiki/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawiki -d dawiki"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
