[project]
name = "da-wiki"
version = "0.1.0"
description = "Browse a local Danish Wikipedia dump"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "mwparserfromhell",
    "pgvector",
    "psycopg[binary]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers",
    "tqdm",
]

[project.scripts]
dawiki = "dawiki.app:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["dawiki"]
